<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
  <title id="t">Security Practice - Blue Team, Detection, Offensive Basics, AI Security, Infrastructure</title>
  <desc id="d">Radar chart showing security practice areas: Blue Team (90%), Detection (80%), Offensive Basics (70%), Infrastructure (85%), AI Security (60%). Plus focus badges.</desc>
  <defs>
    <linearGradient id="secBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080510"/>
      <stop offset="1" stop-color="#120A24"/>
    </linearGradient>
    <linearGradient id="radarFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="radarStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1030"/>
      <stop offset="1" stop-color="#120820"/>
    </linearGradient>
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 13 L60 39 L30 52 L0 39 L0 13 Z" fill="none" stroke="#7C3AED" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
    .pulse-node{animation:pulse 2s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.pulse-node{animation:none}}
  </style>
  <rect width="1000" height="320" fill="url(#secBg)"/>
  <rect width="1000" height="320" fill="url(#hex)"/>

  <g transform="translate(300, 160)">
    <g stroke="#7C3AED" stroke-opacity="0.08" stroke-width="1" fill="none">
      <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"/>
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"/>
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"/>
    </g>
    <g stroke="#7C3AED" stroke-opacity="0.12" stroke-width="0.5">
      <line x1="0" y1="-120" x2="0" y2="120"/>
      <line x1="-104" y1="-60" x2="104" y2="60"/>
      <line x1="-104" y1="60" x2="104" y2="-60"/>
    </g>
    <g font-size="9" fill="#9C90B8" class="mono" text-anchor="middle">
      <text x="0" y="-132">BLUE TEAM</text>
      <text x="120" y="-70">OFFENSIVE</text>
      <text x="120" y="85">INFRA</text>
      <text x="0" y="145">AI SEC</text>
      <text x="-120" y="85">DETECTION</text>
      <text x="-120" y="-70">THM</text>
    </g>
    <polygon points="0,-108 73,-42 73,42 0,54 -73,42 -73,-42" fill="url(#radarFill)" stroke="url(#radarStroke)" stroke-width="2"/>
    <circle class="pulse-node" cx="0" cy="-108" r="6" fill="#7C3AED" filter="url(#nodeGlow)"/>
    <circle cx="73" cy="-42" r="6" fill="#F87171" filter="url(#nodeGlow)"/>
    <circle cx="73" cy="42" r="6" fill="#FBBF24" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="54" r="6" fill="#F87171" filter="url(#nodeGlow)"/>
    <circle cx="-73" cy="42" r="6" fill="#0D9488" filter="url(#nodeGlow)"/>
    <circle cx="-73" cy="-42" r="6" fill="#5EEAD4" filter="url(#nodeGlow)"/>
    <text class="sans" x="0" y="4" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">55/100</text>
    <text class="mono" x="0" y="20" text-anchor="middle" font-size="8" fill="#9C90B8">CAPABILITY</text>
  </g>

  <g transform="translate(520, 30)">
    <text class="mono" x="0" y="0" font-size="9" letter-spacing="2" fill="#7C3AED">FOCUS AREAS</text>
    <line x1="0" y1="10" x2="200" y2="10" stroke="#7C3AED" stroke-opacity="0.3"/>

    <rect x="0" y="24" width="450" height="56" rx="12" fill="url(#cardGrad)" stroke="#5EEAD4" stroke-opacity="0.3"/>
    <text class="sans" x="16" y="54" font-size="16" font-weight="700" fill="#5EEAD4">Blue Team / SOC</text>
    <text class="mono" x="16" y="70" font-size="9" fill="#9C90B8">Traffic analysis . Alert triage . Splunk . Zeek . MITRE ATT&CK mapping</text>

    <rect x="0" y="92" width="450" height="56" rx="12" fill="url(#cardGrad)" stroke="#0D9488" stroke-opacity="0.3"/>
    <text class="sans" x="16" y="122" font-size="16" font-weight="700" fill="#0D9488">Detection Engineering</text>
    <text class="mono" x="16" y="138" font-size="9" fill="#9C90B8">Sigma rules . YARA . Snort . Web-shell detection . Log correlation</text>

    <rect x="0" y="160" width="450" height="56" rx="12" fill="url(#cardGrad)" stroke="#F87171" stroke-opacity="0.3"/>
    <text class="sans" x="16" y="190" font-size="16" font-weight="700" fill="#F87171">Offensive Basics</text>
    <text class="mono" x="16" y="206" font-size="9" fill="#9C90B8">Recon . Enumeration . Vuln assessment . WebEnum . Burp Suite</text>

    <rect x="0" y="228" width="450" height="56" rx="12" fill="url(#cardGrad)" stroke="#FBBF24" stroke-opacity="0.3"/>
    <text class="sans" x="16" y="258" font-size="16" font-weight="700" fill="#FBBF24">Infrastructure Security</text>
    <text class="mono" x="16" y="274" font-size="9" fill="#9C90B8">Linux/Windows hardening . Docker . Nginx . Self-hosted labs . AD basics</text>

    <rect x="0" y="296" width="450" height="56" rx="12" fill="url(#cardGrad)" stroke="#A78BFA" stroke-opacity="0.3"/>
    <text class="sans" x="16" y="326" font-size="16" font-weight="700" fill="#A78BFA">AI Security</text>
    <text class="mono" x="16" y="342" font-size="9" fill="#9C90B8">Prompt injection . LLM attack labs . Guardrail testing</text>
  </g>

  <text class="mono" x="960" y="310" text-anchor="end" font-size="8" letter-spacing="1.5" fill="#3D3058">PRACTICE . THM . LABS</text>
</svg>