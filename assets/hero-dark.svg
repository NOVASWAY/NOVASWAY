<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">Njau Wangari — cybersecurity student and systems builder</title>
  <desc id="d">Profile banner. Njau Wangari, cybersecurity student and systems builder. Breaking systems to understand them, building them back stronger. A radar motif signals continuous learning.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07050F"/>
      <stop offset=".55" stop-color="#0D081A"/>
      <stop offset="1" stop-color="#120A24"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset=".55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset=".2" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset=".8" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="846" y1="52" x2="952" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset=".65" stop-color="#A78BFA" stop-opacity=".10"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="monoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".13"/>
      <stop offset=".65" stop-color="#A78BFA" stop-opacity=".05"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#A78BFA" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes sweepSpin{to{transform:rotate(360deg)}}
.sweep-g{transform-box:view-box;transform-origin:846px 176px;animation:sweepSpin 9s linear infinite}
@keyframes ping{0%,100%{opacity:.25;transform:scale(.55)}45%{opacity:1;transform:scale(1)}}
.blip{transform-box:fill-box;transform-origin:center;animation:ping 4s ease-in-out infinite}
.b2{animation-delay:-1.4s}.b3{animation-delay:-2.6s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{animation:blink 1.15s steps(1,end) infinite}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-26px,16px,0) scale(1.08)}}
.glow-a{transform-box:fill-box;transform-origin:center;animation:drift 18s ease-in-out infinite alternate}
@keyframes trace{to{stroke-dashoffset:-240}}
.trace{stroke-dasharray:3 9;animation:trace 14s linear infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sweep-g,.blip,.cursor,.glow-a,.trace,.breathe{animation:none}}
</style>
  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#dots)"/>
  <ellipse class="glow-a" cx="132" cy="14" rx="430" ry="250" fill="url(#glow1)"/>
  <ellipse cx="930" cy="350" rx="330" ry="200" fill="url(#glow2)"/>

  <!-- radar -->
  <g>
    <circle cx="846" cy="176" r="178" fill="url(#radarGlow)"/>
    <circle cx="846" cy="176" r="130" fill="none" stroke="#A78BFA" stroke-opacity=".62" stroke-width="1.2" stroke-dasharray="1.6 10"/>
    <circle cx="846" cy="176" r="122" fill="none" stroke="#A78BFA" stroke-opacity=".44" stroke-width="1.1"/>
    <circle cx="846" cy="176" r="82" fill="none" stroke="#A78BFA" stroke-opacity=".30"/>
    <circle cx="846" cy="176" r="42" fill="none" stroke="#A78BFA" stroke-opacity=".28"/>
    <line x1="724" y1="176" x2="968" y2="176" stroke="#A78BFA" stroke-opacity=".22" stroke-dasharray="2 7"/>
    <line x1="846" y1="54" x2="846" y2="298" stroke="#A78BFA" stroke-opacity=".22" stroke-dasharray="2 7"/>
    <g class="sweep-g">
      <path d="M846 176 L846 54 A122 122 0 0 1 951.7 115 Z" fill="url(#sweepGrad)"/>
      <line x1="846" y1="176" x2="951.7" y2="115" stroke="#C4B5FD" stroke-opacity=".55" stroke-width="1"/>
    </g>
    <g class="blip b1"><circle cx="908" cy="122" r="9" fill="none" stroke="#C4B5FD" stroke-opacity=".30"/><circle cx="908" cy="122" r="2.8" fill="#C4B5FD"/></g>
    <g class="blip b2"><circle cx="790" cy="226" r="7" fill="none" stroke="#5EEAD4" stroke-opacity=".35"/><circle cx="790" cy="226" r="2.3" fill="#5EEAD4"/></g>
    <g class="blip b3"><circle cx="894" cy="246" r="6" fill="none" stroke="#A78BFA" stroke-opacity=".35"/><circle cx="894" cy="246" r="2.1" fill="#A78BFA"/></g>
    <path d="M846 172 L850 176 L846 180 L842 176 Z" fill="#C4B5FD" fill-opacity=".8"/>
  </g>
  <text class="mono" x="846" y="334" text-anchor="middle" font-size="9.5" letter-spacing="2.6" fill="#8C80A6">SIGNAL // ALWAYS LEARNING</text>

  <!-- monogram + lockup -->
  <rect x="56.5" y="35.5" width="45" height="45" rx="12" fill="none" stroke="url(#monoStroke)" stroke-width="1"/>
  <text class="mono" x="79" y="64" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C4B5FD">NW</text>
  <circle cx="124" cy="50" r="2.2" fill="#A78BFA"/>
  <text class="mono" x="134" y="54" font-size="10.5" letter-spacing="3.2" fill="#D9D0F2">NJAU WANGARI</text>
  <text class="mono" x="134" y="70" font-size="9" letter-spacing="2.4" fill="#8C80A6">PORTFOLIO / 2026</text>
  <text class="mono" x="944" y="38" text-anchor="end" font-size="9" letter-spacing="2.2" fill="#8C80A6">SECURITY · SYSTEMS · SHIPPING</text>

  <!-- headline -->
  <text class="mono" x="57" y="114" font-size="11.5" letter-spacing="3.3" fill="#A78BFA">CYBERSECURITY STUDENT · SYSTEMS BUILDER</text>
  <text class="sans" x="54" y="192" font-size="80" font-weight="700" letter-spacing="-2.4" fill="#F8F5FF">NJAU <tspan fill="url(#nameGrad)">WANGARI</tspan></text>
  <rect x="57" y="212" width="64" height="2" rx="1" fill="#A78BFA"/>
  <text class="sans" x="57" y="246" font-size="19" fill="#D9D0F2">I take systems apart to understand them —</text>
  <text class="sans" x="57" y="269" font-size="19" fill="#D9D0F2">then build them back <tspan font-weight="600" fill="#C4B5FD">stronger</tspan>.</text>
  <text class="mono" x="57" y="296" font-size="11.5" letter-spacing=".4" fill="#A79BC2">blue-team fundamentals · linux &amp; windows internals · full-stack builds</text>

  <!-- terminal line -->
  <text class="mono" x="57" y="328" font-size="12" fill="#A78BFA"> <tspan fill="#8C80A6">$</tspan> <tspan fill="#F8F5FF">whoami</tspan> <tspan fill="#A79BC2">→ security student · builder</tspan></text>
  <rect class="cursor" x="506" y="317" width="7" height="13" rx="1" fill="#A78BFA"/>

  <rect x="0" y="359" width="1000" height="1" fill="url(#hair)"/>
</svg>
