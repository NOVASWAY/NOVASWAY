<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d">
  <title id="t">FieldPulse — weather intelligence for smallholder farmers</title>
  <desc id="d">Dark dashboard artwork showing a weather snapshot for a tomato farm in Kilifi: 27 degrees, risk status Watch, a seven-day rainfall chart, and AI field guidance.</desc>
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080510"/>
      <stop offset=".55" stop-color="#0C0718"/>
      <stop offset="1" stop-color="#120A26"/>
    </linearGradient>
    <radialGradient id="wglow1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".33"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wglow2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0D9488" stop-opacity=".24"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="cardHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset=".35" stop-color="#A78BFA" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#5EEAD4" stop-opacity=".4"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="wdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#A78BFA" fill-opacity=".08"/>
    </pattern>
    <clipPath id="panelClip"><rect x="574" y="48" width="370" height="324" rx="18"/></clipPath>
  </defs>
  <style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes sweepSpin{to{transform:rotate(360deg)}}
.sweep-g{transform-box:view-box;transform-origin:846px 176px;animation:sweepSpin 9s linear infinite}
@keyframes ping{0%,100%{opacity:.25;transform:scale(.55)}45%{opacity:1;transform:scale(1)}}
.blip{transform-box:fill-box;transform-origin:center;animation:ping 4s ease-in-out infinite}
.b2{animation-delay:-1.4s}.b3{animation-delay:-2.6s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{animation:blink 1.15s steps(1,end) infinite}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-26px,16px,0) scale(1.08)}}
.glow-a{transform-box:fill-box;transform-origin:center;animation:drift 18s ease-in-out infinite alternate}
@keyframes trace{to{stroke-dashoffset:-240}}
.trace{stroke-dasharray:3 9;animation:trace 14s linear infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sweep-g,.blip,.cursor,.glow-a,.trace,.breathe{animation:none}}
</style>
  <rect width="1000" height="420" fill="url(#wbg)"/>
  <rect width="1000" height="420" fill="url(#wdots)"/>
  <ellipse cx="120" cy="30" rx="380" ry="260" fill="url(#wglow1)"/>
  <ellipse cx="960" cy="400" rx="340" ry="230" fill="url(#wglow2)"/>

  <rect x="56.5" y="40.5" width="887" height="319" rx="22" fill="none" stroke="url(#cardHair)" stroke-opacity=".55"/>
  <rect x="56" y="40" width="2" height="320" rx="1" fill="url(#cardHair)"/>

  <!-- left copy -->
  <text class="mono" x="86" y="94" font-size="10" letter-spacing="3.2" fill="#A78BFA">01 / SELECTED WORK</text>
  <text class="sans" x="84" y="158" font-size="46" font-weight="700" letter-spacing="-1.4" fill="#F8F5FF">FieldPulse</text>
  <text class="sans" x="86" y="190" font-size="16" fill="#D9D0F2">Weather intelligence for</text>
  <text class="sans" x="86" y="211" font-size="16" fill="#D9D0F2">smallholder farmers.</text>
  <text class="mono" x="86" y="252" font-size="10.5" letter-spacing=".3" fill="#9C90B8">forecasts · ai field guidance · alerts · canopy health</text>
  <line x1="86" y1="274" x2="470" y2="274" stroke="#A78BFA" stroke-opacity=".16"/>
  <text class="mono" x="86" y="298" font-size="10" letter-spacing="1.6" fill="#C4B5FD">NEXT.JS · HONO · NEON · GROQ</text>
  <text class="mono" x="86" y="326" font-size="10" letter-spacing="1.6" fill="#8C80A6">TYPE-SAFE MONOREPO · DETERMINISTIC FALLBACK</text>

  <!-- dashboard panel -->
  <g>
    <rect x="574" y="48" width="370" height="324" rx="18" fill="#0B0716" stroke="#A78BFA" stroke-opacity=".22"/>
    <g clip-path="url(#panelClip)">
      <rect x="574" y="48" width="370" height="324" fill="url(#wglow2)" opacity=".7"/>
      <line x1="574" y1="96" x2="944" y2="96" stroke="#A78BFA" stroke-opacity=".14"/>
      <circle cx="596" cy="71" r="3" fill="#5EEAD4" fill-opacity=".9"/>
      <text class="mono" x="607" y="75" font-size="8.5" letter-spacing="1.7" fill="#9C90B8">FIELDPULSE · KILIFI / TOMATO</text>
      <text class="mono" x="920" y="75" text-anchor="end" font-size="8.5" letter-spacing="1.4" fill="#8C80A6">LIVE</text>

      <text class="sans" x="596" y="156" font-size="44" font-weight="700" letter-spacing="-1" fill="#F8F5FF">27°</text>
      <text class="mono" x="665" y="140" font-size="8.5" letter-spacing=".8" fill="#9C90B8">PARTLY CLOUDY</text>
      <text class="mono" x="665" y="158" font-size="8.5" letter-spacing=".8" fill="#8C80A6">RAIN 62% · HUM 78%</text>

      <rect x="803" y="126" width="118" height="24" rx="12" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".38"/>
      <circle cx="817" cy="138" r="2.4" fill="#FBBF24"/>
      <text class="mono" x="827" y="142" font-size="8.5" letter-spacing="1.3" fill="#FBBF24">WATCH · 24H</text>

      <!-- rainfall chart -->
      <text class="mono" x="596" y="192" font-size="8" letter-spacing="1.4" fill="#8C80A6">RAINFALL · 7 DAYS</text>
      <path d="M596 268 L608 252 L635 258 L662 236 L689 244 L716 218 L743 230 L770 205 L797 220 L824 196 L851 210 L878 188 L905 198 L920 186 L920 286 L596 286 Z" fill="url(#chartFill)"/>
      <path class="trace" d="M596 268 L608 252 L635 258 L662 236 L689 244 L716 218 L743 230 L770 205 L797 220 L824 196 L851 210 L878 188 L905 198 L920 186" fill="none" stroke="url(#chartLine)" stroke-width="2"/>
      <line x1="596" y1="286" x2="920" y2="286" stroke="#A78BFA" stroke-opacity=".16"/>
      <g class="mono" font-size="8" fill="#8C80A6">
        <text x="596" y="303">MON</text><text x="647" y="303">TUE</text><text x="698" y="303">WED</text>
        <text x="749" y="303">THU</text><text x="800" y="303">FRI</text><text x="851" y="303">SAT</text><text x="902" y="303">SUN</text>
      </g>
      <rect x="596" y="322" width="324" height="32" rx="8" fill="#A78BFA" fill-opacity=".06" stroke="#A78BFA" stroke-opacity=".12"/>
      <text class="mono" x="608" y="341" font-size="8.5" letter-spacing=".6" fill="#C4B5FD">AI FIELD NOTE</text>
      <text class="sans" x="694" y="341" font-size="10.5" fill="#D9D0F2">Irrigate early — rain expected after 16:00.</text>
    </g>
  </g>

  <text class="mono" x="920" y="392" text-anchor="end" font-size="8.5" letter-spacing="2" fill="#7A6C96">FIELDPULSE / 2026</text>
</svg>
