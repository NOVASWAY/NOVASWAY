          <text x="20" y="26" text-anchor="middle" font-size="14" fill="#A78BFA">[PY]</text>
        </g>
        <text class="sans" x="50" y="28" font-size="13" font-weight="600" fill="#FFFFFF">Python</text>
        <text class="mono" x="50" y="42" font-size="8" fill="#9C90B8">Scripts • Automation • Crypto</text>
      </g>
      <g transform="translate(0, 60)">
