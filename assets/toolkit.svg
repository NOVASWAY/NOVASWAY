<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">Toolkit — Languages, Security, Systems, Build, AI</title>
  <desc id="d">Visual toolkit matrix with proficiency rings: Languages (Python, Bash, PowerShell, TypeScript, C, SQL), Security (Nmap, Burp, Wireshark, Zeek, Snort, Splunk, Metasploit, Kali), Systems (Linux, Windows, Docker, Nginx, Apache, MySQL, PHP, Git), Build (Next.js, Hono, Prisma, Neon, Groq, Turborepo), AI (Ollama, Hugging Face, Promptfoo).</desc>
  <defs>
    <linearGradient id="tkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080510"/>
      <stop offset="1" stop-color="#120A24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1030"/>
      <stop offset="1" stop-color="#120820"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#7C3AED" stroke-opacity="0.02" stroke-width="0.5"/>
    </pattern>
    <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <rect width="1000" height="360" fill="url(#tkBg)"/>
  <rect width="1000" height="360" fill="url(#grid)"/>

  <!-- 5 columns -->
  <g font-size="10">
    <!-- Column 1: Languages -->
    <g transform="translate(40, 30)">
